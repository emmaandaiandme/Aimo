<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>AIMO</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var last = path.split('/').filter(Boolean).pop() || '';
      if (last && !last.includes('.')) {
        window.location.replace(path.replace(/\/?$/, '') + '.html' + window.location.search + window.location.hash);
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body></body>
</html>
